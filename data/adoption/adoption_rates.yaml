description: 'Raw (unsmoothed) adoption rates of orthographic word pairs.

  adoption_rates_{corpus}.csv: rows are time periods (column ''period'' = year + fraction,
  6-month bins); columns are ''(old_word, new_word)''; value = new/(old+new), the
  adoption of new_word relative to old_word; empty = neither word occurred in that
  period.

  adoption_totals_{corpus}.csv: old+new counts with the same shape, so counts can
  be rebuilt (new = rate*total, old = total-new) for EWMA or pooled curves.

  Corpus suffixes: combined (all issues), bokmaal (nob+dan), nynorsk (nno).

  A reversed pair (new, old) has rate 1-rate.

  reforms: effective year -> pairs changed by that reform.'

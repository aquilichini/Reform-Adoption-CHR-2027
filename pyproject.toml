[project]
name = "orthography-change-mvp"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "conllu>=6.0.0",
    "fasttext-wheel>=0.9.2",
    "flake8>=7.3.0",
    "huggingface-hub>=1.27.0",
    "joblib>=1.5.3",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "nbconvert>=7.17.1",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "pandas-stubs~=3.0.5",
    "pytest>=9.1.1",
    "scipy>=1.18.0",
    "tqdm>=4.70.0",
]

[project.optional-dependencies]
lid = ["fasttext-wheel>=0.9.2", "huggingface-hub>=0.25"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv]
package = false
